<!DOCTYPE html>
<html>
<head>
    <title>Login - Vehicle Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
  <div class="container">
    <h1>User Login</h1>
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" placeholder="Enter your name here">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <textarea type="password" class="form-control" id="password" cols="1000" placeholder="Enter your password"></textarea>
    </div>
      <div style="text-align: center;">
        <button type="submit" class="btn btn-primary">Login</button><br>
        No account ?<a class="fw-bold" href="/templates/signup.html">Sign Up</a>
      </div>
  </div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
