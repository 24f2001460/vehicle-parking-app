<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Vehicle Parking System</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background: linear-gradient(to right, #74ebd5, #acb6e5);height:100vh;display:flex;justify-content: center;align-items: center;">
  <div class="card shadow rounded " style="padding: 20px;width: 100%; max-width: 500px;  background: linear-gradient(to right, #a1c4fd, #c2e9fb);
;">
        <h2 class="mb-4 text-center text-dark">Welcome to ParkHub</h2>
        <form action="/login" method="POST">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your name" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
          </div>
          <div class= "mb-3">
            <button type="submit" class="btn btn-primary">Login</button><br>
            No account? <a class="fw-bold" href="/signup">Sign Up</a>
          </div>
        </form>
      </div>
</body>
</html>
