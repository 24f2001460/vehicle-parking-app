<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body style="background: linear-gradient(to right, #eef2f3, #8e9eab);"></body>
    <div class="container mt-5">
        <h2 class="card-title text-center mb-4">Update Parking Lot</h2>
            <form action="/edit/{{lot.id}}" method='POST'>
            <div class="mb-3">
                <label for="lot_name" class="form-label fw-bold fs-5">Lot Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white" >
                        <i class="bi bi-signpost-2-fill me-1"></i>
                    </span>
                <input type="text" class="form-control" id="lot_name" name="lot_name" value="{{lot.lot_name}}">
            </div>
            </div>
            <div class="mb-3">
                <label for="location" class="form-label fw-bold fs-5">Location</label>
                <div class="input-group">
                     <span class="input-group-text bg-primary text-white">
                        <i class="bi bi-geo-alt-fill"></i>  
                    </span>
                <input type="text" class="form-control" id="location" name="location" value="{{lot.location}}">
            </div>
            </div>
            <div class="mb-3">
                <label for="pincode" class="form-label fw-bold fs-5">Pincode</label>
                <div class="input-group">
                     <span class="input-group-text bg-primary text-white">
                        <i class="bi bi-mailbox-flag text-success me-1"></i>
                    </span>
                <input type="integer" class="form-control" id="pincode" name="pincode" value="{{lot.pincode}}" >
            </div>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label fw-bold fs-5">Price</label>
                <div class="input-group">
                     <span class="input-group-text bg-primary text-white">
                         <i class="bi bi-currency-rupee"></i> 
                    </span>
                <input type="integer" class="form-control" id="price" name="price" value="{{lot.price}}">
                </div>
            </div>
            <div class="mb-3">
                <label for="max_spot" class="form-label fw-bold fs-5">Max_Spots</label>
                <div class="input-group">
                     <span class="input-group-text bg-primary text-white">
                        <i class="bi bi-car-front-fill text-warning me-1"></i>
                    </span>
                <input type="number"  id="max_spot" name="max_spot" value="{{lot.max_spot}}" min="{{lot.occupied_count}}">
                </div>
            </div>
            <button type="submit" class="btn btn-secondary btn-lg w-100 mb-2" value="Save" name="action">
                <i class="bi bi-save2"></i> Save
            </button>
            <button type="submit" class="btn btn-outline-danger btn-lg w-100" value="Cancel" name="action">
                <i class="bi bi-x-circle"></i> Cancel
            </button>
            </form>
        </div>
    </div>
</body>
</html>
