<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <div class="container py-4">
    <h1 class="text-center mb-4">Admin Dashboard</h1>
        <form action="/admin",method='POST'>
    <div class="row g-4">
        {% for lot in lots %}
        <div class="col-sm-6 col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column justify-content-between">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h5 class="card-title mb-0 text-primary">
                            <i class="bi bi-signpost-2-fill me-1"></i> {{ lot.lot_name }}
                        </h5>
                    </div>
                    <div class="position-absolute top-0 end-0 m-2">
                        <a href="/edit/{{lot.id}}" class="btn btn-outline-primary btn-sm me-1" title="Edit">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <a href="/delete/{{lot.id}}" class="btn btn-outline-danger btn-sm" title="Delete">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>


                    <div class="mb-3">
                        <p class="mb-1">
                            <i class="bi bi-geo-alt-fill text-danger me-1"></i>
                            <strong>Location:</strong> {{ lot.location }}
                        </p>
                        <p class="mb-1">
                            <i class="bi bi-mailbox-flag text-success me-1"></i>
                            <strong>Pincode:</strong> {{ lot.pincode }}
                        </p>
                        <p class="mb-1">
                            <i class="bi bi-currency-rupee"></i>
                            <strong>Price:</strong> {{ lot.price }}
                        </p>
                        <p class="mb-0">
                            <i class="bi bi-car-front-fill text-warning me-1"></i>
                            <strong>Max Spots:</strong> 
                            <span class="badge bg-secondary">{{ lot.max_spot }}</span>
                        </p>
                    </div>

                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="text-center mt-4">
        <a href="/new_lot" class="btn btn-success btn-lg">
            <i class="bi bi-plus-circle me-1"></i> Add New Lot
        </a>
    </div>
    </form>
</div>
