<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <div id="main">
        <div id="form-body">
            <h1>Register Form</h1>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Email-Id</label>
                <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter your registered email">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Password</label>
                <textarea type="password" class="form-control" id="exampleFormControlTextarea1" cols="1000" placeholder="Enter your password"></textarea>
            </div>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Full-Name</label>
                <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter your name ">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Address</label>
                <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter your address">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Pincode</label>
                <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Enter your pincode">
            </div>
            <div style="text-align: center;">
                <button type="submit" class="btn btn-primary">Register</button><br>
                Already Registered ?<a class="fw-bold" href="/templates/login.html">Login</a>
            </div>
        </div>
    </div>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
