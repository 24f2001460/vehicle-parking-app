<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        .form-body{
            width: 600px; 
            background-color: #f8f9fa;
            padding: 25px;
            margin: 50px auto;
        }
    </style>
    
</head>
<body>
    <div class="form-body">
        <h3 class="bg-primary text-white p-3 text-center">Lot Name- {{lot.lot_name}}</h3><br>
        <form action="/reserve/{{user.id}}/{{lot.id}}" method="post">
                    <div class="mb-3">
                        <label for="Input1" class="form-label  fw-bold text-dark">Lot ID: </label>
                        <input type="text" class="form-control" value="{{lot.id}}" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="Input3" class="form-label fw-bold text-dark">User ID: </label>
                        <input type="text" class="form-control" id="Input3" value="{{user.id}}" disabled>
                    </div>
                    <div class="mb-3">
                        <label for="Input4" class="form-label  fw-bold text-secondary">Vehicle Number: </label>
                        <input type="text" class="form-control" id="Input4" name="vehicle_num"  required placeholder="Enter your vehicle number">
                    </div>
                   
                    <br>
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <input type="submit" class="btn btn-outline-primary" value="Reserve" name="action">
                        <input type="submit" class="btn btn-outline-danger" value="Close" name="action" formnovalidate>
                    </div>

                </form>
                    
            </div>
        </div>
    </div>
</body>
</html>
