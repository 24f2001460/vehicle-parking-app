<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body style="background: linear-gradient(to right, #74ebd5, #acb6e5);" >
    <div class="container min-vh-50 d-flex  justify-content-center" style="margin-top: 50px;">
    <div class=" card shadow-lg p-4 w-100" style="max-width:500px;">
      <div class="mb-4 text-center fw-bold">
            <h1 >Update Details</h1>
            <form action="/edit_profile/{{user.id}}" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" value="{{user.username}}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" value="{{user.password}}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="integer" class="form-control" id="phone" name="phone" value="{{user.phone}}" required>
            </div>
            <div class="mb-3">
                <label for="fullname" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullname" name="fullname" value="{{user.full_name}}" required>
            </div>
            <div style="text-align: center;">
                <button type="submit" class="btn btn-primary btn-lg w-100 mb-2" value="Update" name="action">
                <i class="bi bi-save2"></i> Update
                <button type="submit" class="btn btn-outline-danger btn-lg w-100 mb-2" value="Cancel" name="action">
                <i class="bi bi-x-circle"></i> Cancel
                </button>
                </button>
            </div>
            </form>
        </div>
    </div>
    </div>
</body>
</html>
