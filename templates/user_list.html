<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="nav justify-content-center">
        <a class="nav-link text-primary fw-bold" href="/admin">Home</a>
        <a class="nav-link text-primary fw-bold" href="/admin_users_list">Users</a>
        <a class="nav-link text-primary fw-bold" href="/admin_summary">Summary</a>
        <a class="nav-link text-primary fw-bold" href="/edit_profile/1">Edit_Profile</a>
        <a href="" class="btn btn-outline-secondary rounded-circle p-0"
        style="width: 29px; height: 29px;"title="search">🔍</a>
        <a href="/login" class="d-flex align-items-center text-decoration-none text-danger fw-bold ms-3">
        <i class="bi bi-box-arrow-right me-1"></i> Log Out
        </a>

    </nav>
    <table>
        <thead>
            <tr>
                <th>User_Id</th>
                <th>Username</th>
                <th>Phone</th>
                <th>Full_name</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{user.id}}</td>
                <td>{{user.username}}</td>
                <td>{{user.phone}}</td>
                <td>{{user.full_name}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
