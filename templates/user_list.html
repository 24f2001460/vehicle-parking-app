<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body {
    background-color:whitesmoke; 
  }
  #canvas {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
  }
   table, th, td {
  border: 3px solid black;
  border-collapse: collapse;
  margin-top: 12px;
}
</style>
</head>
<body>
   <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
<a class="navbar-brand" href="/admin" style="color: white;">Home</a>
      <div class="collapse navbar-collapse justify-content-between" id="navbarContent">
    <form class="d-flex align-items-center" method="POST" action="/admin_search">
      <select class="form-select me-2" name="field" style="width: auto;">
        <option value="user_id/username">User id/Username</option>
        <option value="lot_name/location">Parking Lot Name/ Location</option>
      </select>
      <input class="text" type="search" name="string" placeholder="Search..." required>
      <button class="btn btn-outline-light" type="submit">Search</button>
    </form>
        <a href="#"  style="color:white;">Users</a>
        <a style="color:white" href="/admin_summary">Summary</a>
        <a  href="/login"  style="color:rgb(223, 223, 228);">Log Out</a>
        <strong> Welcome,Admin
    </strong>
  </div>
    </nav>
    <div class="container">
  <div id="canvas">
    <h3 class="text-center mb-2 text-white bg-primary">User's Details</h3>
    <table class="table table-striped">
      <thead class="table-primary">
            <tr>
                <th>User_Id</th>
                <th>Username</th>
                <th>Phone</th>
                <th>Full_name</th>
                <th>Reservation Details</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{user.id}}</td>
                <td>{{user.username}}</td>
                <td>{{user.phone}}</td>
                <td>{{user.full_name}}</td>
                <td><a href="/see_reservation/{{user.id}}" class="btn btn-outline-secondary">Click Hear</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
  </div>
    </div>
</body>
</html>
