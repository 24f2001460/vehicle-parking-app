<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Available Spot</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous"> 
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body style="background: linear-gradient(to right, #a1c4fd, #c2e9fb);">
    <div class="container d-flex justify-content-center align-items-center min-vh-100" >
        <div class="card p-4  border border-5 border-dark" style=" width:100%;max-width:500px;">
        <h4 class="mb-3 text-center text-dark fw-bold" >Spot Details</h4>
    <form action="/read_available_spot/{{spot.id}}/{{lot.id}}"  method="post">
        <div class="mb-3">
        <label for="id" class="form-label fw-semibold">Spot_id</label>
        <input type="text" value="{{spot.id}}" disabled  id="id">
        </div>
        <div class="mb-3">
        <label for="status" class="form-label fw-semibold">Spot_Status</label>
        <input type="text" value="{{spot.status}}" disabled  id="status">
        </div>
        <div class="d-flex justify-content-center gap-2">
        <button type="submit" value="Delete" name="action" class="btn btn-secondary">Delete</button>
        <button type="submit" value="Cancel" name="action" class="btn btn-danger">Cancel</button>
      </div>
    </form>
</div>
</div>
</body>
</html>
